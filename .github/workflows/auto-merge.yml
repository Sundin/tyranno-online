name: Auto-merge green pull requests

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Queue squash merge
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Enable squash auto-merge for this revision
        run: gh pr merge "$PR_URL" --repo "$GH_REPO" --auto --squash --match-head-commit "$PR_HEAD_SHA"
